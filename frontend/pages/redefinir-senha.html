<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>GranaLab - Redefinir senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/style.css">
</head>
<body>
    <main class="auth-layout">
        <section class="brand-panel" aria-label="Sobre o GranaLab">
            <a class="brand" href="../index.html" aria-label="GranaLab - início"><span class="brand-mark" aria-hidden="true">✦</span><span class="brand-grana">Grana</span><span class="brand-lab">Lab</span></a>
            <div class="brand-copy"><h1>Seu futuro começa<br>com boas escolhas.</h1><p>Aprenda a cuidar do seu dinheiro com conteúdos e atividades de educação financeira.</p></div>
            <span class="decor decor-top" aria-hidden="true"></span><span class="decor decor-bottom" aria-hidden="true"></span>
        </section>
        <section class="form-panel">
            <form class="auth-card" id="form-redefinir-senha" novalidate>
                <h2>Crie uma nova senha</h2>
                <p class="subtitle">Informe o e-mail, o token recebido e sua nova senha.</p>
                <div class="field"><label for="email">E-mail</label><input type="email" id="email" name="email" maxlength="100" autocomplete="email" placeholder="Digite seu e-mail" required></div>
                <div class="field"><label for="token">Token de redefinição</label><input type="text" id="token" name="token" autocomplete="one-time-code" placeholder="Cole o token recebido" required></div>
                <div class="field"><label for="nova-senha">Nova senha</label><input type="password" id="nova-senha" name="novaSenha" maxlength="255" autocomplete="new-password" required><small class="field-hint">Mínimo de 8 caracteres e sem espaços.</small></div>
                <div class="field"><label for="confirma-senha">Confirmação de senha</label><input type="password" id="confirma-senha" name="confirmaSenha" maxlength="255" autocomplete="new-password" required></div>
                <div id="mensagem-redefinicao" class="form-message" role="alert" aria-live="polite" hidden></div>
                <button type="submit" class="button button-primary" id="btn-redefinir">Redefinir senha</button>
                <a href="../index.html" class="button button-outline">Voltar ao login</a>
            </form>
        </section>
    </main>
    <script src="../resources/app.js"></script>
</body>
</html>
