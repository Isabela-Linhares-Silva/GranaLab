<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GranaLab - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="../resources/img/LogoGranaLab.png" alt="Logo GranaLab" class="logo-imagem">
            <h2>Seu futuro começa<br>com boas escolhas.</h2>
            <p>Aprenda a cuidar do seu dinheiro com conteúdos e atividades de educação financeira.</p>
        </div>
        <div class="login">
            <form class="caixa-login" id="form-cadastro">
                <h2 id="titulo-cadastro">Crie sua conta</h2>
                <p class="subtitulo" id="subtitulo-cadastro">Comece sua jornada no GranaLab!</p>
                <!-- Seleção de tipo de perfil (T017) -->
                <div class="campo">
                    <label for="perfil">Tipo de perfil</label>
                    <div style="display: flex; gap: 20px; margin-bottom: 12px; font-size: 20px; color: #060608;">
                        <label style="cursor: pointer;">
                            <input type="radio" name="perfil" id="perfil-aluno" value="aluno" checked>
                            Aluno
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="perfil" id="perfil-mentor" value="mentor">
                            Mentor
                        </label>
                    </div>
                </div>
                <!-- Campos comuns (T018, T019) -->
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" maxlength="100" required>
                </div>
                <!-- Campos específicos Aluno (T018) -->
                <div class="campos-aluno" id="campos-aluno" style="display: block;">
                    <div class="campo">
                        <label for="data-nascimento">Data de nascimento</label>
                        <input type="date" id="data-nascimento" required>
                    </div>
                    <div class="campo">
                        <label for="genero">Gênero</label>
                        <select id="genero" required>
                            <option value="">Selecione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outro</option>
                        </select>
                    </div>
                </div>
                <!-- Campo específico Mentor (T019) -->
                <div class="campo campos-mentor" id="campos-mentor" style="display: none;">
                    <label for="escola">Instituição de ensino / Escola</label>
                    <input type="text" id="escola" placeholder="Nome da escola (opcional)" maxlength="100">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" maxlength="100" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Crie uma senha" maxlength="255" required>
                </div>
                <div class="campo">
                    <label for="confirma-senha">Confirmação de senha</label>
                    <input type="password" id="confirma-senha" placeholder="Repita sua senha" required>
                </div>
                <div id="mensagem-erro" style="color: #d32f2f; font-size: 13px; margin-bottom: 12px; display: none;"></div>
                <button type="submit" class="btn-entrar" id="btn-cadastrar">Criar conta</button>
                <a href="../index.html" class="btn-criar-conta">Já tenho conta</a>
            </form>
        </div>
    </div>
    <script src="../resources/app.js"></script>
</body>
</html>
