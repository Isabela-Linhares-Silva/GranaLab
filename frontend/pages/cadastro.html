<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>GranaLab - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/style.css">
</head>
<body>
    <main class="auth-layout auth-layout-compact">
        <section class="brand-panel" aria-label="Sobre o GranaLab">
            <a class="brand" href="../index.html" aria-label="GranaLab - início">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span class="brand-grana">Grana</span><span class="brand-lab">Lab</span>
            </a>
            <div class="brand-copy">
                <h1>Seu futuro começa<br>com boas escolhas.</h1>
                <p>Aprenda a cuidar do seu dinheiro com conteúdos e atividades de educação financeira.</p>
            </div>
            <span class="decor decor-top" aria-hidden="true"></span>
            <span class="decor decor-bottom" aria-hidden="true"></span>
        </section>

        <section class="form-panel form-panel-scroll">
            <form class="auth-card auth-card-wide" id="form-cadastro" novalidate>
                <h2 id="titulo-cadastro">Crie sua conta</h2>
                <p class="subtitle" id="subtitulo-cadastro">Comece sua jornada no GranaLab.</p>

                <fieldset class="profile-choice">
                    <legend>Tipo de perfil</legend>
                    <label class="choice-option"><input type="radio" name="perfil" id="perfil-aluno" value="Aluno" checked> <span>Aluno</span></label>
                    <label class="choice-option"><input type="radio" name="perfil" id="perfil-mentor" value="Mentor"> <span>Mentor</span></label>
                </fieldset>

                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" maxlength="100" autocomplete="name" required>
                </div>

                <div id="campos-aluno" class="profile-fields">
                    <div class="field">
                        <label for="data-nascimento">Data de nascimento</label>
                        <input type="date" id="data-nascimento" name="dataNascimento" required>
                    </div>
                    <div class="field">
                        <label for="genero">Gênero</label>
                        <select id="genero" name="genero" required>
                            <option value="">Selecione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outro</option>
                        </select>
                    </div>
                </div>

                <div id="campos-mentor" class="profile-fields" hidden>
                    <div class="field">
                        <label for="escola">Instituição de ensino / Escola <span class="optional">(opcional)</span></label>
                        <input type="text" id="escola" name="escolaAtua" placeholder="Nome da instituição" maxlength="100">
                    </div>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" maxlength="100" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" maxlength="255" autocomplete="new-password" required>
                    <small class="field-hint">Mínimo de 8 caracteres e sem espaços.</small>
                </div>
                <div class="field">
                    <label for="confirma-senha">Confirmação de senha</label>
                    <input type="password" id="confirma-senha" name="confirmaSenha" placeholder="Repita sua senha" maxlength="255" autocomplete="new-password" required>
                </div>
                <div id="mensagem-erro" class="form-message" role="alert" aria-live="polite" hidden></div>
                <button type="submit" class="button button-primary" id="btn-cadastrar">Criar conta</button>
                <a href="../index.html" class="button button-outline">Já tenho conta</a>
            </form>
        </section>
    </main>
    <script src="../resources/app.js"></script>
</body>
</html>
