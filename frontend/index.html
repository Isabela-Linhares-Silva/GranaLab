<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GranaLab - Login</title>
    
    <!-- Fonte importada do Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="resources/css/style.css">
</head>
<body>

    <div class="container">
       
        <div class="logo">
            <img src="resources/img/LogoGranaLab.png" alt="Logo GranaLab" class="logo-imagem">
            <h2>Seu futuro começa<br>com boas escolhas.</h2>
            <p>Aprenda a cuidar do seu dinheiro com conteúdos e atividades de educação financeira.</p>
        </div>

        <div class="login">
            
            <form class="caixa-login">
                <h2>Boas-vindas de volta!</h2>
                <p class="subtitulo">Entre na sua conta para continuar.</p>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                </div>

                <div class="opcoes">
                    <label>
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-entrar">Entrar</button>

                <p class="texto-cadastro">Ainda não tem uma conta?</p>
                
                <a href="pages/cadastro.html" class="btn-criar-conta">Criar conta</a>
            </form>

        </div>

    </div>

</body>
</html>
